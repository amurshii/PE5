<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureCrypt — авторизація</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand">
      <span class="brand__logo">&#128274;</span>
      <div>
        <h1>SecureCrypt</h1>
        <p>Web-застосунок із шифруванням даних користувачів</p>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="login">Вхід</button>
      <button class="tab" data-tab="register">Реєстрація</button>
    </div>

    <!-- Форма входу -->
    <form id="loginForm" class="form" novalidate>
      <label>Логін
        <input type="text" id="loginName" autocomplete="username" placeholder="Введіть логін">
      </label>
      <label>Пароль
        <input type="password" id="loginPass" autocomplete="current-password" placeholder="Введіть пароль">
      </label>
      <label class="check">
        <input type="checkbox" id="loginShow"> Показати пароль
      </label>
      <div class="msg" id="loginMsg"></div>
      <button type="submit" class="btn">Увійти</button>
    </form>

    <!-- Форма реєстрації -->
    <form id="registerForm" class="form hidden" novalidate>
      <label>ПІБ
        <input type="text" id="regName" placeholder="Прізвище Ім'я">
        <small class="err" data-for="regName"></small>
      </label>
      <label>Логін
        <input type="text" id="regLogin" placeholder="латиниця, цифри, _">
        <small class="err" data-for="regLogin"></small>
      </label>
      <label>Електронна пошта
        <input type="email" id="regEmail" placeholder="name@example.com">
        <small class="err" data-for="regEmail"></small>
      </label>
      <label>Телефон
        <input type="tel" id="regPhone" placeholder="+380XXXXXXXXX">
        <small class="err" data-for="regPhone"></small>
      </label>
      <label>Пароль
        <input type="password" id="regPass" placeholder="не менше 8 символів">
        <small class="err" data-for="regPass"></small>
      </label>
      <label>Підтвердження пароля
        <input type="password" id="regPass2" placeholder="повторіть пароль">
        <small class="err" data-for="regPass2"></small>
      </label>
      <label class="check">
        <input type="checkbox" id="regShow"> Показати паролі
      </label>
      <div class="msg" id="regMsg"></div>
      <button type="submit" class="btn">Зареєструватися</button>
    </form>
  </main>

  <script src="js/crypto.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
